<html>
	<head>
		<title>황희원 회원가입</title>
		<script>
			function goCheck(){
				var id  = mem.t_id.value;
				
				alert(id);
			}
			
		</script>
	</head>
	<body>
		<form name="mem">
			<fieldset >
				<legend>회원가입</legend>
				<table border="0" width="100%">
				<colgroup>
					<col width="30%"/>
					<col width="70%"/>
				<tr>
					<td>아이디</td>
					<td><input type= "text" name="t_id" size="12" maxlength="8"/></td>
				</tr>
				<tr>
					<td>비밀번호</td>
					<td><input type="password" name="t_password" size="20" maxlength="12"/></td>
				</tr>
				<tr>
					<td>비밀번호 확인</td>
					<td><input type ="password" size = "20" maxlength = "12"/></td>
				</tr>
				<tr>
					<td>성명</td>
					<td><input type = "text" size="8" maxlength="5"/></td>
				</tr>
				<tr>
					<td>지역</td>
					<td><select>
							<option value ="서울">서울</option>
							<option value="대전">대전</option>
							<option value="대구">대구</option>
							<option value="부산">부산</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>주소</td>
					<td><input type="text" size="30" maxlength="40"/></td>
				</tr>
				<tr>
					<td>연락처</td>
					<td><input type="text" size="3" maxlength="3"/> - <input type="text" size="4" maxlength="4"/> - <input type="text" size="4" maxlength="4"/></td>
				</tr>
				<tr>
					<td>메일 수신여부</td>
					<td><input type="radio" value="Y" name ="receive"/>예
					<input type="radio" value="N" name="receive"/>아니요 </td>
				</tr>
				<tr>
					<td>관심분야</td>
					<td><input type="checkbox" value="음식" name="chk1"/>음식
					<input type="checkbox" value="게임" name="chk2"/>게임
					<input type="checkbox" value="운동" name="chk3"/>운동</td>
				</tr>
				<tr>
					<th colspan="2"><input type="button" onclick="goCheck()" value="회원가입"/>
					<input type="reset" value="다시작성"/></th>
				</tr>
			</fieldset>
		</form>
	</body>

</html>
